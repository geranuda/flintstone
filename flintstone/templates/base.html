<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flintstone{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <nav>
            <ul>
                <li><a href="/" class="brand"><span class="brand-mark"></span>Flintstone <span class="brand-tag">Native</span></a></li>
            </ul>
            <ul>
                <li><a href="/">Projects</a></li>
                <li><a href="/api/docs" target="_blank">API &amp; CDS docs</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <div id="flash-container"></div>
        {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
