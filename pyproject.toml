[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flintstone"
version = "0.2.0"
description = "Lightweight translation management system with a Transifex Native compatible CDS"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
flintstone = "flintstone.cli:main"

[tool.setuptools.package-data]
flintstone = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
